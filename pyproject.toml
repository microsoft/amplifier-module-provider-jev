[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "amplifier-module-provider-jev"
version = "0.1.0.dev0"
description = "TypeSafe Jev decision capability for Amplifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "amplifier-lib-decisions @ git+https://github.com/microsoft/amplifier-lib-decisions@main"]
[project.entry-points."amplifier.modules"]
provider-jev = "amplifier_module_provider_jev:mount"
[project.entry-points."amplifier.decision_backends"]
jev = "amplifier_module_provider_jev.catalog:catalog"
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_provider_jev"]
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/microsoft/amplifier-module-provider-jev"
